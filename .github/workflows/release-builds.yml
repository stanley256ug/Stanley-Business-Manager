name: Release Builds (Windows Desktop & Android APK/AAB)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Windows x64 (.exe / .msi / Portable)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies & build web + server bundle
        run: |
          npm ci
          npm run build

      - name: Install Electron packager & rebuild native SQLite module
        working-directory: electron
        run: |
          npm install
          npx electron-rebuild -f -w better-sqlite3 -m ..

      - name: Package Windows installers (NSIS .exe, .msi, Portable)
        run: npx --prefix electron electron-builder --config electron-builder.yml --win nsis msi portable

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stanley-business-manager-windows
          path: |
            release/windows/*.exe
            release/windows/*.msi

  build-android:
    name: Android Signed APK & Play Store AAB (Android 8.0+)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build production web bundle
        run: |
          npm ci
          npm run build

      - name: Initialize & sync Capacitor Android project
        run: |
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android @capacitor/splash-screen
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap sync android
          mkdir -p android/app/src/main/res/drawable
          cp public/pwa-512x512.png android/app/src/main/res/drawable/splash.png
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 26/' android/variables.gradle || true

      - name: Decode Android keystore (if configured)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks

      - name: Build Android APK and App Bundle (.aab)
        working-directory: android
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Upload Android APK & AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stanley-business-manager-android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
