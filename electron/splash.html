<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starting STANLEY BUSINESS MANAGER</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #0b1d3a;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        user-select: none;
        border: 2px solid rgba(200, 155, 60, 0.45);
      }
      .logo-box {
        width: 96px;
        height: 96px;
        border-radius: 18px;
        overflow: hidden;
        border: 2px solid rgba(200, 155, 60, 0.6);
        margin-bottom: 18px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      }
      .logo-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      h1 {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      .sub {
        margin-top: 6px;
        font-size: 12px;
        color: #c89b3c;
        font-weight: 600;
      }
      .bar-wrap {
        margin-top: 24px;
        width: 210px;
        height: 4px;
        background: rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        overflow: hidden;
      }
      .bar {
        width: 45%;
        height: 100%;
        background: #c89b3c;
        border-radius: 999px;
        animation: slide 1.3s ease-in-out infinite;
      }
      .status {
        margin-top: 10px;
        font-size: 11px;
        color: #94a3b8;
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(260%);
        }
      }
    </style>
  </head>
  <body>
    <div class="logo-box">
      <img src="../public/pwa-512x512.png" alt="Stanley Business Manager" />
    </div>
    <h1>STANLEY BUSINESS MANAGER</h1>
    <div class="sub">Printing · Graphics · Branding Studio</div>
    <div class="bar-wrap"><div class="bar"></div></div>
    <div class="status">Initializing local SQLite workspace...</div>
  </body>
</html>
